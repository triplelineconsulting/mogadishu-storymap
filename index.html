<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8' />
    <title>Flood Risk in Mogadishu</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src="./dist/bundle.js"></script>
    <link href='./dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        /* ============================================================
           TRIPLE LINE BRAND
           Fonts:  Franklin Gothic Medium (headings) / Book (body)
                   rendered on web via self-hosted Libre Franklin
           Colours (from Triple_Line_Word_Template_FINAL.dotx theme):
             --tl-teal        #00797E  accent 1  (headings, links)
             --tl-orange      #F78D2A  accent 2  (highlights)
             --tl-slate       #313E48  dark 2    (body text)
             --tl-ink         #111921  accent 3  (deep dark)
             --tl-steel       #4F738E  accent 4
             --tl-grey        #4C5560  accent 5
             --tl-palegrey    #EAECED  light 2   (deep-dive bg)
             --tl-line        #CFD3D3  accent 6  (borders)
             --tl-cyan        #00BBD2  hyperlink
           ============================================================ */
        :root {
            --tl-teal: #00797E;
            --tl-teal-dark: #004D4F;
            --tl-orange: #F78D2A;
            --tl-slate: #313E48;
            --tl-ink: #111921;
            --tl-steel: #4F738E;
            --tl-grey: #4C5560;
            --tl-palegrey: #EAECED;
            --tl-line: #CFD3D3;
            --tl-cyan: #00BBD2;
        }

        /* Self-hosted Libre Franklin (open-source Franklin Gothic alternative).
           Real Franklin Gothic kept as fallback for Windows/Office machines. */
        @font-face {
            font-family: 'Libre Franklin';
            font-weight: 400;
            font-style: normal;
            font-display: swap;
            src: url('./fonts/LibreFranklin-Regular.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Libre Franklin';
            font-weight: 500;
            font-style: normal;
            font-display: swap;
            src: url('./fonts/LibreFranklin-Medium.woff2') format('woff2');
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Libre Franklin', 'Franklin Gothic Book', Arial, sans-serif;
            font-weight: 400;
            color: var(--tl-slate);
        }

        a,
        a:visited {
            color: var(--tl-teal);
        }
        a:hover {
            color: var(--tl-orange);
        }

        #map {
            top: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        #mapInset {
            display: none;
            bottom: 50px;
            right: 30px;
            height: 180px;
            width: 250px;
            max-width: 100%;
            position: fixed;
            z-index: 1;
            opacity: 1;
            border: 1px solid var(--tl-grey);
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        #bookmarks {
            margin: 0;
            width: 100vw;
            position: fixed;
            top: 0;
            z-index: 6;
            background-color: var(--tl-ink);
        }

        #bookmarks p {
            padding: 1vh;
            text-align: center;
            color: white;
            font-size: 0.8em;
        }
        #bookmarks a { color: #fff; text-decoration: none; margin: 0 4px; }
        #bookmarks a:hover { color: var(--tl-orange); }

        /* ---- Title / header block ---- */
        #header {
            margin: 3vh auto;
            width: 60vw;
            padding: 3vh 2vw;
            position: relative;
            z-index: 5;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.94);
            border-top: 6px solid var(--tl-teal);
            border-radius: 6px;
            box-shadow: 0 2px 12px rgba(17, 25, 33, 0.18);
        }

        #header h1,
        #header h2,
        #header p {
            margin: 0;
            padding: 1.2vh 1vw;
            text-align: center;
        }

        /* Headings: Franklin Gothic Medium weight, Triple Line teal */
        #header h1,
        #header h2,
        .step h3 {
            font-family: 'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif;
            font-weight: 500;
            color: var(--tl-teal);
        }
        #header h1 { font-size: 2.6rem; line-height: 1.15; }
        #header h2 { font-size: 1.35rem; color: var(--tl-slate); font-weight: 500; }
        #header p  { font-size: 0.95rem; color: var(--tl-grey); }

        #footer {
            width: 100%;
            min-height: 5vh;
            padding-top: 2vh;
            padding-bottom: 2vh;
            text-align: center;
            line-height: 25px;
            font-size: 13px;
            position: relative;
            z-index: 5;
            background-color: var(--tl-slate);
            color: var(--tl-palegrey);
        }
        #footer a, #footer a:visited { color: var(--tl-cyan); }
        #footer p { padding: 0 10rem; }

        #features {
            padding-top: 10vh;
            padding-bottom: 10vh;
        }

        .hidden { visibility: hidden; }
        .centered { width: 50vw; margin: 0 auto; }
        .lefty { width: 33vw; margin-left: 5vw; }
        .righty { width: 33vw; margin-left: 62vw; }
        .fully { width: 100%; margin: auto; }

        /* Chapter card themes. We use the light theme, branded. */
        .light {
            color: var(--tl-slate);
            background-color: rgba(255, 255, 255, 0.94);
        }
        .dark {
            color: var(--tl-palegrey);
            background-color: rgba(49, 62, 72, 0.94);
        }

        .step {
            padding-bottom: 50vh;
            opacity: 0.25;
        }
        .step.active { opacity: 0.95; }

        .step > div {
            padding: 28px 34px;
            line-height: 1.5;
            font-size: 14px;
            border-radius: 6px;
            border-top: 4px solid var(--tl-teal);
            box-shadow: 0 2px 12px rgba(17, 25, 33, 0.18);
        }
        /* inner text wrapper carries no box of its own */
        .step > div > div { padding: 0; border: 0; border-radius: 0; box-shadow: none; }

        .step h3 {
            font-size: 1.7em;
            line-height: 1.25em;
            margin: 0 0 0.4em;
        }

        .step p {
            font-size: 1.05em;
            line-height: 1.6em;
        }

        .step img { width: 100%; border-radius: 4px; }
        .step .caption { font-size: 0.85em; color: var(--tl-grey); font-style: italic; }
        .step .returntop { font-size: 0.85em; margin-top: 1em; }

        /* ---- Deep Dive callout boxes (click to expand) ---- */
        details.deep-dive {
            margin: 1.2em 0 0.2em;
            background-color: var(--tl-palegrey);
            border-left: 4px solid var(--tl-teal);
            border-radius: 4px;
            padding: 0;
        }
        details.deep-dive > summary {
            cursor: pointer;
            list-style: none;
            padding: 12px 16px;
            font-family: 'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif;
            font-weight: 500;
            font-size: 0.95em;
            color: var(--tl-teal);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        details.deep-dive > summary::-webkit-details-marker { display: none; }
        details.deep-dive > summary::before {
            content: "＋";
            font-weight: 700;
            color: var(--tl-orange);
        }
        details.deep-dive[open] > summary::before { content: "－"; }
        details.deep-dive .dd-body {
            padding: 0 16px 16px 16px;
            font-size: 0.92em;
            line-height: 1.6;
            color: var(--tl-slate);
        }
        details.deep-dive .dd-body strong { color: var(--tl-teal-dark); }

        /* Small stat emphasis used in-line in the narrative */
        .stat { color: var(--tl-orange); font-weight: 500; }

        #rotate-mobile { display: none; }

        .legend {
            position: fixed;
            right: 30px;
            bottom: 30px;
            color: var(--tl-slate);
            background-color: #fff;
            box-shadow: 0 1px 4px rgba(17, 25, 33, 0.25);
            font-family: 'Libre Franklin', 'Franklin Gothic Book', Helvetica, sans-serif;
            padding: 14px 16px;
            display: none;
            z-index: 1;
            max-width: 350px;
            border-top: 4px solid var(--tl-teal);
            border-radius: 4px;
        }
        .legend h3 {
            margin: 0 0 10px;
            font-family: 'Libre Franklin', 'Franklin Gothic Medium', Helvetica, sans-serif;
            font-weight: 500;
            color: var(--tl-teal);
            font-size: 1em;
        }
        .legend img { width: 25px; margin-right: 10px; }
        .legend div { vertical-align: center; }
        .legend div #block { display: inline-block; height: 20px; width: 30px; margin-right: 5px; }
        .legend div #text { vertical-align: top; }

        .maplibregl-ctrl { margin-right: 30px !important; }
        .maplibregl-popup {
            font: 12px/20px 'Libre Franklin', Helvetica, sans-serif;
        }

        /* ---- Right-side panel (legends / media) ---- */
        #sidePanel {
            position: fixed;
            top: 12vh;
            right: 30px;
            width: 320px;
            max-width: 40vw;
            max-height: 76vh;
            overflow-y: auto;
            z-index: 4;
            background-color: rgba(255,255,255,0.96);
            border-top: 4px solid var(--tl-teal);
            border-radius: 6px;
            box-shadow: 0 2px 12px rgba(17,25,33,0.18);
            padding: 16px 18px;
            font-size: 0.9em;
            line-height: 1.5;
            color: var(--tl-slate);
        }
        #sidePanel h4 {
            margin: 0 0 10px;
            color: var(--tl-teal);
            font-family: 'Libre Franklin','Franklin Gothic Medium',sans-serif;
            font-weight: 500; font-size: 1.05em;
        }
        #sidePanel img { width: 100%; border-radius: 4px; margin: 6px 0 2px; display:block; }
        #sidePanel .cap { font-size: 0.8em; color: var(--tl-grey); font-style: italic; margin: 0 0 12px; line-height:1.4; }
        #sidePanel .row { margin: 4px 0; }
        #sidePanel .swatch { display:inline-block; width:14px; height:14px; border-radius:2px; margin-right:7px; vertical-align:middle; border:1px solid rgba(0,0,0,0.15); }
        #sidePanel .scenario { display:flex; gap:6px; margin:4px 0 10px; }
        #sidePanel .scenario span { flex:1; text-align:center; padding:4px 0; border-radius:3px; font-size:0.8em; background:#EAECED; color:#4C5560; }
        #sidePanel .scenario span.on { background:var(--tl-teal); color:#fff; font-weight:500; }
        #sidePanel .controls { margin-top:10px; padding-top:10px; border-top:1px solid #CFD3D3; }
        #sidePanel .ctrl-title { font-weight:500; color:var(--tl-teal); margin:6px 0 6px; font-size:0.95em; }
        #sidePanel .ctrl-btn {
            display:inline-flex; align-items:center; gap:6px; cursor:pointer;
            border:1px solid #CFD3D3; background:#fff; color:#4C5560;
            border-radius:4px; padding:5px 9px; margin:0 5px 5px 0; font-size:0.82em;
            font-family:'Libre Franklin','Franklin Gothic Book',sans-serif;
        }
        #sidePanel .ctrl-btn .sw { width:11px; height:11px; border-radius:2px; display:inline-block; }
        #sidePanel .ctrl-btn.on { border-color:var(--tl-teal); background:rgba(0,121,126,0.08); color:var(--tl-slate); font-weight:500; }
        #sidePanel .ctrl-btn.radio.on { background:var(--tl-teal); color:#fff; border-color:var(--tl-teal); }
        #sidePanel.left { right:auto; left:30px; }

        /* Tap-to-enlarge lightbox */
        #lightbox { display:none; position:fixed; inset:0; z-index:20; background:rgba(17,25,33,0.93);
            align-items:center; justify-content:center; flex-direction:column; padding:4vh 3vw; cursor:zoom-out; }
        #lightbox.open { display:flex; }
        #lightbox img { max-width:96vw; max-height:86vh; border-radius:4px; box-shadow:0 6px 30px rgba(0,0,0,0.55); }
        #lightbox .lb-cap { color:#EAECED; font-size:0.86em; font-style:italic; margin-top:14px; max-width:900px; text-align:center; line-height:1.45; }
        .step figure img, #sidePanel img { cursor:zoom-in; }
        .step figure figcaption::after { content:" (tap to enlarge)"; color:var(--tl-line); font-style:normal; }

        /* Partner logo strip */
        .logo-strip { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:22px 26px; margin:16px auto 2px; max-width:100%; }
        .logo-strip img { width:auto !important; border-radius:0 !important; cursor:default; box-shadow:none; }
        .logo-strip .eu-block { display:inline-flex; align-items:center; gap:8px; }
        .logo-strip .eu-block .eu-text { font-size:11px; line-height:1.15; color:#003399; text-align:left; font-family:'Libre Franklin','Franklin Gothic Book',sans-serif; }
                .logo-strip .lg-crest { height:46px !important; }
        .logo-strip .lg-mopw { height:34px !important; }
        .logo-strip .lg-eu { height:30px !important; }
        .logo-strip .lg-acp { height:40px !important; }
        .logo-strip .lg-gfdrr { height:26px !important; }
        .logo-strip .lg-tl { height:24px !important; }
        .logo-strip .lg-hkv { height:30px !important; }
        .logo-strip .lg-rg { height:44px !important; }
        #header .logo-strip { margin-top:18px; padding-top:14px; border-top:1px solid var(--tl-line); }

        /* ---- Figures embedded in chapter text ---- */
        .step figure { margin: 1.3em 0; }
        .step figure img { width: 100%; border-radius: 4px; display: block; }
        .step figcaption { font-size: 0.82em; color: var(--tl-grey); font-style: italic; margin-top: 6px; line-height: 1.45; }
        .step .figtitle { font-family:'Libre Franklin','Franklin Gothic Medium',sans-serif; font-weight:500; color:var(--tl-teal); margin: 1.3em 0 0.2em; }
        .step figcaption a, #sidePanel .cap a { color: inherit; text-decoration: underline; }

        @media (max-width: 750px) {
            #features { width: 90vw; margin: 0 auto; }
            #bookmarks { display: none; }
            #header { width: 80vw; }
            #header img { width: 80vw; }
            #header h1 {
                font-family: 'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif;
                font-weight: 500;
                font-size: 1.9rem;
            }
            .lefty, .righty { width: 90%; margin: 0 auto; }
            .step > div { padding: 18px 20px; }
            .step > div h3 {
                font-family: 'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif;
                font-size: 1.4rem;
                font-weight: 500;
            }
            #footer p { padding: 0 1rem; }
            #rotate-mobile { display: inline-block; margin-top: 25px; }

            #sidePanel { top: auto; bottom: 8px; right: 8px; left: 8px; width: auto; max-width: none; max-height: 34vh; }
            .centered, .lefty, .righty, .fully { width: 90vw; margin: 0 auto; }
        }

        /* Fix issue on mobile browser where scroll breaks */
        .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,
        .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas {
            touch-action: unset;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="mapInset"></div>
    <div id="sidePanel" class="side-panel" style="display:none"></div>
    <div id="lightbox"><img alt=""><div class="lb-cap"></div></div>
    <div id="story"></div>
    <script src="./config.js"></script>
    <script src="./sources.js"></script>
    <script>
        var initLoad = true;
        var layerTypes = {
            'fill': ['fill-opacity'],
            'line': ['line-opacity'],
            'circle': ['circle-opacity', 'circle-stroke-opacity'],
            'symbol': ['icon-opacity', 'text-opacity'],
            'raster': ['raster-opacity'],
            'fill-extrusion': ['fill-extrusion-opacity'],
            'heatmap': ['heatmap-opacity']
        }
        var alignments = { 'left': 'lefty', 'center': 'centered', 'right': 'righty', 'full': 'fully' }

        // ---- Toggleable layer controls ----
        function applyControl(item, on) {
            (item.layers || []).forEach(function (ly) {
                if (!map.getLayer(ly)) return;
                var t = map.getLayer(ly).type;
                var props = layerTypes[t] || [];
                var val = on ? (item.opacity != null ? item.opacity : 0.8) : 0;
                props.forEach(function (p) { map.setPaintProperty(ly, p, val); });
            });
        }
        function renderControls(chapter) {
            if (!chapter.controls) return '';
            var groups = Array.isArray(chapter.controls) ? chapter.controls : [chapter.controls];
            var html = "<div class='controls'>";
            groups.forEach(function (g, gi) {
                if (g.type === 'radio' && g.active == null) g.active = 0;
                if (g.title) html += "<div class='ctrl-title'>" + g.title + "</div>";
                g.items.forEach(function (it, i) {
                    var on = g.type === 'radio' ? (i === g.active) : (it.on !== false);
                    var sw = it.color ? "<span class='sw' style='background:" + it.color + "'></span>" : "";
                    html += "<button class='ctrl-btn " + (g.type === 'radio' ? 'radio ' : '') + (on ? 'on' : '') +
                        "' data-g='" + gi + "' data-i='" + i + "'>" + sw + it.label + "</button>";
                });
            });
            return html + "</div>";
        }
        function wireControls(chapter, sp) {
            if (!chapter.controls) return;
            var groups = Array.isArray(chapter.controls) ? chapter.controls : [chapter.controls];
            sp.querySelectorAll('.ctrl-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var g = groups[+btn.getAttribute('data-g')], idx = +btn.getAttribute('data-i');
                    if (g.type === 'radio') {
                        g.items.forEach(function (it, i) { applyControl(it, i === idx); });
                        g.active = idx;
                        sp.querySelectorAll(".ctrl-btn[data-g='" + btn.getAttribute('data-g') + "']").forEach(function (b) {
                            b.classList.toggle('on', +b.getAttribute('data-i') === idx);
                        });
                    } else {
                        var it = g.items[idx]; it.on = (it.on === false);
                        applyControl(it, it.on);
                        btn.classList.toggle('on', it.on);
                    }
                });
            });
        }

        function getLayerPaintType(layer) {
            var layerType = map.getLayer(layer).type;
            return layerTypes[layerType];
        }
        function setLayerOpacity(layer) {
            var paintProps = getLayerPaintType(layer.layer);
            paintProps.forEach(function (prop) {
                var options = {};
                if (layer.duration) {
                    var transitionProp = prop + "-transition";
                    options = { "duration": layer.duration };
                    map.setPaintProperty(layer.layer, transitionProp, options);
                }
                map.setPaintProperty(layer.layer, prop, layer.opacity, options);
            });
        }

        const navigation = new maplibregl.NavigationControl();
        if (config.use3dTerrain) {
            map.addControl(new maplibregl.TerrainControl({ source: 'terrainSource', exaggeration: 1 }));
        }

        const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
        const popupHover = (e) => {
            map.getCanvas().style.cursor = 'pointer';
            const coordinates = e.features[0].geometry.coordinates.slice();
            const description = e.features[0].properties.Community_;
            while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
            }
            popup.setLngLat(coordinates).setHTML(description).addTo(map);
        }
        const popupHoverAway = () => { popup.remove(); map.getCanvas().style.cursor = 'default'; }
        const turnPopupsOn = (layer) => { map.on('mouseenter', layer, popupHover); map.on('mouseleave', layer, popupHoverAway); };
        const turnPopupsOff = (layer) => { map.off('mouseenter', layer, popupHover); map.off('mouseleave', layer, popupHoverAway); };

        var story = document.getElementById('story');
        var features = document.createElement('div');
        features.setAttribute('id', 'features');
        var header = document.createElement('div');

        if (config.title) {
            var titleText = document.createElement('h1');
            titleText.innerText = config.title;
            header.appendChild(titleText);
        }
        if (config.logo) { var image = new Image(); image.src = config.logo; header.appendChild(image); }
        if (config.subtitle) {
            var subtitleText = document.createElement('h2');
            subtitleText.innerText = config.subtitle;
            header.appendChild(subtitleText);
        }
        if (config.byline) {
            var bylineText = document.createElement('p');
            bylineText.innerText = config.byline;
            header.appendChild(bylineText);
        }
        if (config.logos) {
            var logoDiv = document.createElement('div');
            logoDiv.className = 'logo-strip';
            logoDiv.innerHTML = config.logos;
            header.appendChild(logoDiv);
        }
        if (header.innerText.length > 0) {
            header.classList.add(config.theme);
            header.setAttribute('id', 'header');
            story.appendChild(header);
        }

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');
            if (record.title) {
                var title = document.createElement('h3');
                title.innerText = record.title;
                chapter.appendChild(title);
            }
            if (record.image) { var image = new Image(); image.src = record.image; chapter.appendChild(image); }
            if (record.caption) {
                caption = document.createElement('p');
                caption.setAttribute("class", "caption");
                caption.innerHTML = `<em>${record.caption}</em>`;
                chapter.appendChild(caption);
            }
            if (record.description) {
                var storyText = document.createElement('div');
                storyText.innerHTML = record.description;
                chapter.appendChild(storyText);
                if (record.author) {
                    author = document.createElement('p');
                    author.innerHTML = '<strong>By ' + record.author + '</strong>';
                    chapter.appendChild(author);
                }
                if (record.website) {
                    var website = document.createElement('p');
                    website.innerHTML = `» ${record.website}`;
                    chapter.appendChild(website);
                }
                if (config.chapterReturn) {
                    var returnTop = document.createElement('p');
                    returnTop.setAttribute("class", "returntop");
                    returnTop.innerHTML = '<a href="#header">Back to top ↑</a>';
                    chapter.appendChild(returnTop);
                }
            }
            if (record.legend) {
                var legend = document.createElement('div');
                legend.setAttribute("class", "legend");
                legend.setAttribute("id", (record.id + "Legend"));
                legend.innerHTML = '<div>' + record.legend + '</div>';
                document.body.append(legend);
            }
            container.setAttribute('id', record.id);
            container.classList.add('step');
            if (idx === 0) { container.classList.add('active'); }
            chapter.classList.add(config.theme);
            container.appendChild(chapter);
            container.classList.add(alignments[record.alignment] || 'centered');
            if (record.hidden) { container.classList.add('hidden'); }
            features.appendChild(container);
        });
        story.appendChild(features);

        var footer = document.createElement('div');
        if (config.bookmarks) {
            var bookmarksText = "<strong>Contents</strong>: ";
            for (i = 0; i < config.chapters.length; i++) {
                if (config.chapters[i].title) {
                    bookmarksText += `<a href=#${config.chapters[i].id}>${config.chapters[i].title}</a>`;
                    if (i != config.chapters.length - 1) { bookmarksText += " | "; }
                }
            }
            var headerBookmarks = document.createElement('h5');
            headerBookmarks.innerHTML = bookmarksText;
            header.appendChild(headerBookmarks);
            var footerBookmarks = document.createElement('p');
            footerBookmarks.innerHTML = bookmarksText;
            footer.appendChild(footerBookmarks);
        }
        if (config.mobileview) {
            var mobileText = document.createElement('p');
            mobileText.innerHTML = config.mobileview;
            header.appendChild(mobileText);
        }
        if (config.footer) {
            var footerText = document.createElement('p');
            footerText.innerHTML = config.footer;
            footer.appendChild(footerText);
        }
        if (footer.innerText.length > 0) {
            footer.classList.add(config.theme);
            footer.setAttribute('id', 'footer');
            story.appendChild(footer);
        }

        var map = new maplibregl.Map({
            container: 'map',
            style: config.style,
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            interactive: true,
            dragPan: false, dragRotate: false, doubleClickZoom: false,
            scrollZoom: false, touchZoomRotate: false, maplibreLogo: true
        });

        if (config.inset && !config.legend) {
            var insetMap = new maplibregl.Map({
                container: 'mapInset',
                style: config.style,
                center: config.chapters[0].location.center,
                zoom: 3, hash: false, interactive: false, attributionControl: false,
            });
        }

        if (config.showMarkers) {
            var marker = new maplibregl.Marker({ color: config.markerColor });
            marker.setLngLat(config.chapters[0].location.center).addTo(map);
        }

        var scroller = scrollama();
        map.on("load", function () {
            if (config.use3dTerrain) {
                map.addSource('terrainSource', { 'type': 'raster-dem', 'url': 'map/terrain-tiles/tiles.json', tileSize: 256 });
                map.setTerrain({ 'source': 'terrainSource', 'exaggeration': 1 });
            };
            if (config.useCustomLayers) {
                for (i = 0; i < externalData.sources.length; i++) {
                    let currentSource = externalData.sources[i];
                    map.addSource(currentSource.name, currentSource.source);
                }
                for (i = 0; i < externalData.layers.length; i++) {
                    map.addLayer(externalData.layers[i]);
                }
            }
            if (config.inset && !config.legend) { map.on('move', getInsetBounds); }

            scroller.setup({ step: '.step', offset: 0.5, progress: true })
                .onStepEnter(async response => {
                    var chapter = config.chapters.find(chap => chap.id === response.element.id);
                    if (config.legend && !config.inset) {
                        for (i = 0; i < config.chapters.length; i++) {
                            if (config.chapters[i].legend != undefined) {
                                var el = document.getElementById(config.chapters[i].id + "Legend");
                                if (el) el.style.display = (config.chapters[i].id == response.element.id) ? "block" : "none";
                            }
                        };
                    }
                    response.element.classList.add('active');
                    var sp = document.getElementById('sidePanel');
                    var panelHtml = (chapter.sidePanel || '') + renderControls(chapter);
                    if (panelHtml) { sp.innerHTML = panelHtml; sp.style.display = 'block'; sp.scrollTop = 0; sp.classList.toggle('left', chapter.alignment === 'right'); wireControls(chapter, sp); }
                    else { sp.style.display = 'none'; sp.innerHTML = ''; }
                    map[chapter.mapAnimation || 'flyTo'](chapter.location);
                    if (config.inset && !config.legend) {
                        if (chapter.location.zoom < 5) { insetMap.flyTo({ center: chapter.location.center, zoom: 0 }); }
                        else { insetMap.flyTo({ center: chapter.location.center, zoom: 3 }); }
                    }
                    if (config.showMarkers) { marker.setLngLat(chapter.location.center); }
                    if (chapter.onChapterEnter.length > 0) { chapter.onChapterEnter.forEach(setLayerOpacity); }
                    if (chapter.mapInteractive) {
                        map.addControl(navigation);
                        map.dragPan.enable(); map.doubleClickZoom.enable();
                        map.getCanvas().style.cursor = 'grab';
                    } else {
                        if (map.hasControl(navigation)) { map.removeControl(navigation); }
                        map.dragPan.disable(); map.doubleClickZoom.disable();
                        map.getCanvas().style.cursor = 'default';
                    }
                    if (chapter.callback) { window[chapter.callback](); }
                    if (chapter.rotateAnimation) {
                        map.once('moveend', () => {
                            const rotateNumber = map.getBearing();
                            map.rotateTo(rotateNumber + 180, { duration: 30000, easing: function (t) { return t; } });
                        });
                    }
                })
                .onStepExit(response => {
                    var chapter = config.chapters.find(chap => chap.id === response.element.id);
                    response.element.classList.remove('active');
                    if (chapter.onChapterExit.length > 0) { chapter.onChapterExit.forEach(setLayerOpacity); }
                });
        });

        function getInsetBounds() {
            let bounds = map.getBounds();
            let boundsJson = {
                "type": "FeatureCollection",
                "features": [{ "type": "Feature", "properties": {}, "geometry": { "type": "Polygon", "coordinates": [[
                    [bounds._sw.lng, bounds._sw.lat], [bounds._ne.lng, bounds._sw.lat],
                    [bounds._ne.lng, bounds._ne.lat], [bounds._sw.lng, bounds._ne.lat],
                    [bounds._sw.lng, bounds._sw.lat]]] } }]
            }
            if (initLoad) { addInsetLayer(boundsJson); initLoad = false; }
            else { updateInsetLayer(boundsJson); }
        }
        function addInsetLayer(bounds) {
            insetMap.addSource('boundsSource', { 'type': 'geojson', 'data': bounds });
            insetMap.addLayer({ 'id': 'boundsLayer', 'type': 'fill', 'source': 'boundsSource', 'layout': {}, 'paint': { 'fill-color': '#00797E', 'fill-opacity': 0.2 } });
            insetMap.addLayer({ 'id': 'outlineLayer', 'type': 'line', 'source': 'boundsSource', 'layout': {}, 'paint': { 'line-color': '#00797E', 'line-width': 1 } });
        }
        function updateInsetLayer(bounds) { insetMap.getSource('boundsSource').setData(bounds); }
        // Lightbox: click any figure / side-panel image to enlarge
        (function () {
            var lb = document.getElementById('lightbox');
            var lbImg = lb.querySelector('img');
            var lbCap = lb.querySelector('.lb-cap');
            document.addEventListener('click', function (e) {
                if (lb.classList.contains('open')) { lb.classList.remove('open'); return; }
                var img = e.target.closest ? e.target.closest('.step figure img, #sidePanel img') : null;
                if (!img) return;
                lbImg.src = img.src;
                var fc = img.parentElement.querySelector('figcaption');
                lbCap.textContent = fc ? fc.textContent : (img.alt || '');
                lb.classList.add('open');
            });
        })();

        window.addEventListener('resize', scroller.resize);
    </script>
</body>
</html>
